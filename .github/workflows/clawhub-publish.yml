name: ClawHub Publish

# The workflow `openclaw plugins init --type provider` generates (OpenClaw 2026.11.2),
# plus a build job: the package ships compiled `dist/`, which is not in git, so the
# reusable workflow publishes the `npm pack` tarball (`package_artifact_name`).
# Releases use ClawHub trusted publishing (GitHub OIDC): the package's trusted
# publisher names this repository and this file, so no token is stored.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        required: true
        type: boolean
        default: true

permissions: {}

# One release at a time; a second dispatch waits instead of racing the first.
concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  pack:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clawhub-package
          path: "*.tgz"
          if-no-files-found: error

  publish:
    needs: pack
    permissions:
      actions: read # download the packed tarball artifact
      contents: read
      id-token: write # ClawHub trusted publishing (GitHub OIDC)
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@9d49df109d4ad3dc8a6ecf05d26b39f46d294721
    with:
      dry_run: ${{ inputs.dry_run }}
      owner: nagaai
      package_artifact_name: clawhub-package
